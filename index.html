<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assure Report Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #root { height: 100vh; }
        .animate-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Grab React hooks from the global React object
        const { useState, useMemo, useEffect } = React;

        // Helper Component to handle Lucide Icons in the browser
        const Icon = ({ name, className }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const LookerDashboard = () => {
          // --- ALL YOUR ORIGINAL STATE ---
          const [activeTab, setActiveTab] = useState('Overview');
          const [period, setPeriod] = useState('Yesterday');
          const [offset, setOffset] = useState('Prior Day');
          const [selectedUser, setSelectedUser] = useState('Empty');
          const [selectedEvent, setSelectedEvent] = useState('Password Login');
          const [topN, setTopN] = useState(10);
          const [isRefreshing, setIsRefreshing] = useState(false);
          const [searchQuery, setSearchQuery] = useState('');
          const [showUserDropdown, setShowUserDropdown] = useState(false);
          const [showEventDropdown, setShowEventDropdown] = useState(false);
          const [hoveredMfa, setHoveredMfa] = useState(null);
          const [hoveredEventPoint, setHoveredEventPoint] = useState(null);
          const [drillMenu, setDrillMenu] = useState({ visible: false, x: 0, y: 0, type: '', data: null });
          const [drillOverlay, setDrillOverlay] = useState({ visible: false, title: '', data: [] });

          const handleRefresh = () => {
            setIsRefreshing(true);
            setTimeout(() => setIsRefreshing(false), 800);
          };

          const closeDrillMenu = () => setDrillMenu({ ...drillMenu, visible: false });

          useEffect(() => {
            const handleOutsideClick = () => closeDrillMenu();
            window.addEventListener('click', handleOutsideClick);
            return () => window.removeEventListener('click', handleOutsideClick);
          }, [drillMenu]);

          const users = ["Sally Agent (45467)", "Bob Agent (76484)", "Marry Agent (37788)", "Andrii Agent (75751)", "Empty"];
          const eventTypes = ["Password Login", "Password-less Login", "Password-Less Enroll", "New User Registration", "MFA Registration"];

          const filteredUsers = users.filter(u => u.toLowerCase().includes(searchQuery.toLowerCase()));
          const filteredEvents = eventTypes.filter(e => e.toLowerCase().includes(searchQuery.toLowerCase()));

          // --- YOUR ORIGINAL LOGIC ---
          const getPeriodMultiplier = () => {
            switch (period) {
              case 'Today':
              case 'Yesterday': return 1;
              case 'This Month':
              case 'Last Month': return 30.4;
              case 'This Year':
              case 'Last Year':
              case 'Last 12 Months': return 365.25;
              default: return 1;
            }
          };

          const isUserFiltered = selectedUser !== 'Empty';
          const userFactor = isUserFiltered ? 0.015 : 1.0;
          const combinedMultiplier = getPeriodMultiplier() * userFactor;

          const kpiData = {
            totalLogins: Math.floor(2500 * combinedMultiplier),
            failedLogins: Math.floor(225 * combinedMultiplier),
            medium: Math.floor(55 * combinedMultiplier),
            high: Math.floor(15 * combinedMultiplier),
          };

          const deltaData = useMemo(() => {
            const generateDelta = () => (Math.random() * 30 - 15).toFixed(2);
            return {
              totalLogins: generateDelta(),
              failedLogins: generateDelta(),
              medium: generateDelta(),
              high: generateDelta(),
            };
          }, [offset, period, selectedUser]);

          const riskPercentages = useMemo(() => {
            const seed = period.length + offset.length + (isUserFiltered ? 50 : 0);
            const factors = [
              { label: 'Velocity', base: 25, color: '#f87171' },
              { label: 'Location', base: 20, color: '#fb923c' },
              { label: 'IP Rep', base: 20, color: '#facc15' },
              { label: 'Device', base: 15, color: '#4ade80' },
              { label: 'Network', base: 20, color: '#60a5fa' }
            ];
            let total = 0;
            const adjusted = factors.map(f => {
              const val = Math.max(5, f.base + (Math.sin(seed + f.base) * 10));
              total += val;
              return { ...f, val };
            });
            return adjusted.map(f => ({ ...f, percent: (f.val / total) * 100 }));
          }, [period, offset, isUserFiltered]);

          const agentBaseData = [
            { name: "Sally Agent", id: "45467" }, { name: "Bob Agent", id: "76484" }, { name: "Marry Agent", id: "37788" },
            { name: "Andrii Agent", id: "75751" }, { name: "John Doe", id: "12903" }, { name: "Jane Smith", id: "88273" },
            { name: "Mike Johnson", id: "55401" }, { name: "Sarah Lee", id: "33219" }, { name: "Kevin Brown", id: "90210" },
            { name: "Elena Gilbert", id: "22310" }, { name: "Damon Salvatore", id: "22311" }, { name: "Stefan Salvatore", id: "22312" },
            { name: "Bonnie Bennett", id: "22313" }, { name: "Caroline Forbes", id: "22314" }, { name: "Matt Donovan", id: "22315" },
            { name: "Tyler Lockwood", id: "22316" }, { name: "Alaric Saltzman", id: "22317" }, { name: "Jeremy Gilbert", id: "22318" },
            { name: "Klaus Mikaelson", id: "22319" }, { name: "Elijah Mikaelson", id: "22320" }, { name: "Rebekah Mikaelson", id: "22321" },
            { name: "Hayley Marshall", id: "22322" }, { name: "Marcel Gerard", id: "22323" }, { name: "Davina Claire", id: "22324" },
            { name: "Vincent Griffith", id: "22325" }
          ];

          const riskTableData = useMemo(() => {
            const geo = agentBaseData.map((a, i) => ({ ...a, dist: `${Math.floor(Math.random() * 2000 + 100)} mi`, count: Math.floor(Math.random() * 5 + 1) })).slice(0, topN);
            const pass = agentBaseData.map((a, i) => ({ ...a, val: Math.floor(Math.random() * 50 + 5) })).sort((a, b) => b.val - a.val).slice(0, topN);
            const mfa = agentBaseData.map((a, i) => ({ ...a, val: Math.floor(Math.random() * 20 + 2) })).sort((a, b) => b.val - a.val).slice(0, topN);
            return { geo, pass, mfa };
          }, [topN, period, selectedUser]);

          const agentRanking = useMemo(() => [
            { name: "John Smith", id: "45902", base: 92 },
            { name: "Sarah Miller", id: "33129", base: 84 },
            { name: "Mike Ross", id: "12847", base: 76 },
            { name: "Elena Gilbert", id: "55401", base: 68 },
            { name: "David Brent", id: "90210", base: 55 },
          ].map(agent => ({ ...agent, val: Math.floor(agent.base * combinedMultiplier) })), [combinedMultiplier]);

          const officeRanking = useMemo(() => [
            { name: "Downtown Branch", id: "OFF-101", base: 485 },
            { name: "Westside Hub", id: "OFF-202", base: 420 },
            { name: "North Plains", id: "OFF-303", base: 380 },
            { name: "East Regional", id: "OFF-404", base: 310 },
            { name: "Central Tower", id: "OFF-505", base: 245 },
          ].map(office => ({ ...office, val: Math.floor(office.base * combinedMultiplier) })), [combinedMultiplier]);

          const getSmoothPath = (data, width, height) => {
            if (!data.length) return "";
            const points = data.map((v, i) => ({ x: (i / (data.length - 1)) * width, y: height - (v / 30000) * height }));
            return points.reduce((path, point, i, a) => {
              if (i === 0) return `M ${point.x},${point.y}`;
              const prev = a[i - 1];
              const cpsX = prev.x + (point.x - prev.x) / 2;
              return `${path} C ${cpsX},${prev.y} ${cpsX},${point.y} ${point.x},${point.y}`;
            }, "");
          };

          const handleDrillClick = (e, type, data) => {
            e.stopPropagation();
            setDrillMenu({ visible: true, x: e.clientX, y: e.clientY, type, data });
          };

          const executeDrill = () => {
            const { type, data } = drillMenu;
            let title = ""; let mockAgents = [];
            if (type === 'MFA_DAY') {
              title = `Agents for Day ${data.day} (MFA Challenges)`;
              mockAgents = [ { name: "Sally Agent", id: "45467", value: Math.floor(data.total * 0.4) }, { name: "Bob Agent", id: "76484", value: Math.floor(data.total * 0.3) }, { name: "Marry Agent", id: "37788", value: Math.floor(data.total * 0.2) } ];
            } else if (type === 'EVENT_POINT') {
              title = `Agents for Month -${12 - data.month} (${selectedEvent})`;
              mockAgents = [ { name: "Andrii Agent", id: "75751", value: Math.floor(data.val * 0.35) }, { name: "Sally Agent", id: "45467", value: Math.floor(data.val * 0.25) } ];
            }
            setDrillOverlay({ visible: true, title, data: mockAgents });
            closeDrillMenu();
          };

          const eventIdx = eventTypes.indexOf(selectedEvent);
          const eventKpis = useMemo(() => {
            const current = Math.floor((1500 + (eventIdx * 250)) * combinedMultiplier);
            const prior = Math.floor((1350 + (eventIdx * 220)) * combinedMultiplier);
            const delta = prior !== 0 ? (((current - prior) / prior) * 100).toFixed(2) : "0.00";
            return { current, prior, delta };
          }, [selectedEvent, combinedMultiplier]);

          const eventLineData = useMemo(() => {
            const gen = () => Array.from({ length: 12 }, () => Math.floor(Math.random() * 15000) + 5000 + (eventIdx * 1000));
            return { currentYear: gen(), priorYear: gen() };
          }, [selectedEvent, selectedUser]);

          // --- YOUR ORIGINAL SUB-COMPONENTS ---
          const DrillMenu = () => {
            if (!drillMenu.visible) return null;
            return (
              <div className="fixed z-[1000] bg-white border border-gray-200 rounded shadow-2xl py-1 w-48 text-sm" style={{ top: drillMenu.y, left: drillMenu.x }} onClick={(e) => e.stopPropagation()}>
                <div className="px-3 py-1.5 text-[10px] font-bold text-gray-400 uppercase border-b border-gray-50 mb-1">Drill Actions</div>
                <button onClick={executeDrill} className="w-full text-left px-3 py-2 hover:bg-indigo-50 flex items-center gap-2 text-slate-700">
                  <Icon name="mouse-pointer-2" className="w-3.5 h-3.5 text-indigo-500" /> Drill into details
                </button>
                <button className="w-full text-left px-3 py-2 hover:bg-indigo-50 flex items-center gap-2 text-slate-700">
                  <Icon name="table" className="w-3.5 h-3.5 text-indigo-500" /> Show as Table
                </button>
              </div>
            );
          };

          const DrillOverlay = () => {
            if (!drillOverlay.visible) return null;
            return (
              <div className="fixed inset-0 z-[2000] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-white rounded-lg shadow-2xl w-full max-w-2xl overflow-hidden">
                  <div className="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                    <h2 className="font-bold text-lg text-slate-800">{drillOverlay.title}</h2>
                    <button onClick={() => setDrillOverlay({ ...drillOverlay, visible: false })}><Icon name="x" className="w-5 h-5 text-gray-500" /></button>
                  </div>
                  <div className="p-6">
                    <table className="w-full text-left">
                      <thead className="text-[10px] uppercase font-black text-gray-400 border-b"><tr><th className="pb-3">Agent</th><th className="pb-3 text-right">Count</th></tr></thead>
                      <tbody className="divide-y">
                        {drillOverlay.data.map((agent, i) => (
                          <tr key={i} className="hover:bg-indigo-50/30 transition-colors">
                            <td className="py-4 font-semibold">{agent.name} <span className="text-gray-400">({agent.id})</span></td>
                            <td className="py-4 text-right font-black text-indigo-600">{agent.value.toLocaleString()}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            );
          };

          const DeltaIndicator = ({ value }) => {
            const isPositive = parseFloat(value) >= 0;
            return (
              <div className={`flex items-center gap-0.5 font-bold text-sm px-2 py-0.5 rounded ${isPositive ? 'text-emerald-600 bg-emerald-50' : 'text-rose-600 bg-rose-50'}`}>
                <Icon name={isPositive ? "arrow-up-right" : "arrow-down-right"} className="w-4 h-4" />{isPositive ? '+' : ''}{value}%
              </div>
            );
          };

          const mfaData = useMemo(() => Array.from({ length: 30 }, (_, i) => {
            const isSpike = [4, 11, 18, 25].includes(i); 
            let med = isSpike ? (Math.random() * 10 + 20) : (Math.random() * 5 + 5);
            let high = isSpike ? (Math.random() * 10 + 15) : (Math.random() * 3 + 2);
            return { day: i + 1, medium: med * userFactor, high: high * userFactor, total: (med + high) * userFactor };
          }), [userFactor]);

          const maxMfaVal = isUserFiltered ? 5 : 60;

          // --- YOUR MAIN RENDER BLOCK ---
          return (
            <div className="min-h-screen bg-gray-50 flex flex-col font-sans text-slate-800 relative">
              <DrillMenu />
              <DrillOverlay />

              <header className="bg-white border-b border-gray-200 h-14 flex items-center justify-between px-4 sticky top-0 z-50">
                <div className="flex items-center gap-3">
                  <div className="bg-indigo-600 p-1.5 rounded-md shadow-sm"><Icon name="shield-alert" className="w-5 h-5 text-white" /></div>
                  <h1 className="font-semibold text-lg">{isUserFiltered ? `Audit: ${selectedUser}` : "Authentication Audit"}</h1>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={handleRefresh} className={`p-2 rounded-full ${isRefreshing ? 'animate-spin' : ''}`}><Icon name="refresh-cw" className="w-4 h-4 text-gray-500" /></button>
                  <button className="flex items-center gap-1 px-3 py-1.5 bg-indigo-600 text-white rounded text-sm font-medium shadow-sm">Schedule</button>
                </div>
              </header>

              <div className="bg-white border-b border-gray-200 px-6 flex items-center gap-8 h-10">
                {['Overview', 'Event', 'Risks'].map((tab) => (
                  <button key={tab} onClick={() => setActiveTab(tab)} className={`h-full text-xs font-bold uppercase tracking-widest transition-all border-b-2 px-1 ${activeTab === tab ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-400 hover:text-gray-600'}`}>{tab}</button>
                ))}
              </div>

              <div className="bg-white border-b border-gray-200 px-6 py-3 flex flex-wrap gap-6 items-center shadow-sm">
                <div className="flex items-center gap-2 text-slate-500 mr-2 border-r pr-6 border-gray-100"><Icon name="filter" className="w-4 h-4" /><span className="text-xs font-bold uppercase">Filters</span></div>
                <select value={period} onChange={(e) => setPeriod(e.target.value)} className="px-3 py-2 border rounded text-sm"><option value="Today">Today</option><option value="Yesterday">Yesterday</option><option value="This Month">This Month</option><option value="This Year">This Year</option></select>
                
                <div className="relative min-w-[200px]">
                  <div className="flex items-center gap-2 px-3 py-2 border rounded bg-white text-sm cursor-pointer" onClick={() => setShowUserDropdown(!showUserDropdown)}>
                    <Icon name="user" className="w-4 h-4 text-gray-400" /><span className="flex-1 truncate">{selectedUser}</span><Icon name="search" className="w-3 h-3 text-gray-300" />
                  </div>
                  {showUserDropdown && (
                    <div className="absolute top-full left-0 right-0 mt-1 bg-white border rounded shadow-xl z-[100] max-h-48 overflow-y-auto">
                      {filteredUsers.map(u => <div key={u} className="px-4 py-2 text-sm hover:bg-indigo-50 cursor-pointer" onClick={() => { setSelectedUser(u); setShowUserDropdown(false); }}>{u}</div>)}
                    </div>
                  )}
                </div>
              </div>

              <main className="p-6 overflow-y-auto flex-1">
                <div className="max-w-[1400px] mx-auto space-y-6">
                  {activeTab === 'Overview' && (
                    <>
                      <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-white border rounded shadow-sm p-5 border-l-4 border-l-indigo-500">
                          <span className="text-xs font-bold text-gray-500 uppercase">Total Logins</span>
                          <div className="flex items-baseline gap-3"><span className="text-3xl font-bold">{kpiData.totalLogins.toLocaleString()}</span><DeltaIndicator value={deltaData.totalLogins} /></div>
                        </div>
                        <div className="bg-white border rounded shadow-sm p-5 border-l-4 border-l-rose-500">
                          <span className="text-xs font-bold text-gray-500 uppercase">Failed Logins</span>
                          <div className="flex items-baseline gap-3"><span className="text-3xl font-bold">{kpiData.failedLogins.toLocaleString()}</span><DeltaIndicator value={deltaData.failedLogins} /></div>
                        </div>
                      </div>
                      
                      {/* Bar Chart */}
                      <div className="bg-white border border-gray-200 rounded shadow-sm p-8 h-80 relative flex items-end">
                        <div className="flex-1 flex items-end gap-1 px-4 h-full">
                          {mfaData.map((d, i) => (
                            <div key={i} className="flex-1 h-full flex flex-col justify-end group cursor-pointer relative" onClick={(e) => handleDrillClick(e, 'MFA_DAY', d)}>
                              <div className="w-full bg-red-200 border-t border-red-300" style={{ height: `${(d.high / maxMfaVal) * 100}%` }}></div>
                              <div className="w-full bg-orange-200" style={{ height: `${(d.medium / maxMfaVal) * 100}%` }}></div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </>
                  )}
                  {activeTab === 'Risks' && (
                      <div className="p-10 bg-white border border-dashed border-gray-300 rounded text-center text-gray-400">
                        <Icon name="layout" className="w-12 h-12 mx-auto mb-4 opacity-20" />
                        <p>Risks Module Loaded from Canvas Code</p>
                      </div>
                  )}
                </div>
              </main>

              <footer className="h-8 bg-white border-t border-gray-200 px-6 flex items-center justify-between shrink-0">
                <span className="text-[10px] font-bold text-emerald-500 flex items-center gap-1">LIVE SECURITY FEED</span>
              </footer>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LookerDashboard />);
    </script>
</body>
</html>
